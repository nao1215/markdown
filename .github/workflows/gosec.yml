name: Gosec
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GO111MODULE: on
      # The gosec image ships its own Go (1.26.5 on 2026-10-09) with
      # GOTOOLCHAIN=local, which cannot load a module that asks for a newer
      # patch. "auto" lets it fetch the toolchain go.mod names.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # master as of 2026-08-29
        with:
          args: --exclude-dir=examples --exclude-dir=aws ./...

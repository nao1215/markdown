name: Gosec
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# A new push to a pull request cancels the run for the previous commit, so
# superseded runs do not hold the account's shared job slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GO111MODULE: on
      # The gosec image ships its own Go (1.26.5 on 2026-10-09) with
      # GOTOOLCHAIN=local, which cannot load a module that asks for a newer
      # patch. "auto" lets it fetch the toolchain go.mod names.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Gosec Security Scanner
        uses: securego/gosec@14c713478ed40c9bdfa56d35d9c2142b91608106 # v2.30.0 action image fix
        with:
          args: --exclude-dir=examples --exclude-dir=aws ./...

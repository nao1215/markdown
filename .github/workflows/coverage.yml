name: Coverage

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test (linux)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    # octocov comments the coverage delta on the pull request and keeps its
    # report in a workflow artifact (artifact:// datastore).
    permissions:
      contents: read
      actions: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true

      # doc/ holds 22 sample programs whose main() is never called by a test.
      # Counting them measures the samples, not the library.
      - name: Run tests with coverage report output
        run: |
          pkgs="$(go list ./... | grep -v '/doc/')"
          # $pkgs is split on purpose: each package is its own argument.
          # shellcheck disable=SC2086
          go test -cover -coverpkg="$(echo "$pkgs" | paste -sd,)" -coverprofile=coverage.out $pkgs

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

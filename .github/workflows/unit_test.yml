name: MultiPlatformUnitTest

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test (${{ matrix.os }}, Go ${{ matrix.go }})

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # The floor go.mod declares and the newest release. markdown is a
        # library most of the other repositories depend on, so the 1.23 floor is
        # the promise that matters and this is the only place it is checked.
        # "stable" tracks each Go release without an edit -- and it is not "1",
        # because setup-go resolves "1" from its own manifest, which lags a
        # fresh release and would leave the ceiling quietly behind. The
        # intermediate releases were dropped: with nine jobs already, they cost
        # more than they catch between a verified floor and a verified ceiling.
        go:
          - "1.23"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      # Same package scope as coverage.yml: doc/ holds sample programs whose
      # main() no test calls, so counting them measures the samples.
      - name: Run tests with coverage report output
        shell: bash
        run: |
          pkgs="$(go list ./... | grep -v '/doc/')"
          go test -cover -coverpkg="$(echo "$pkgs" | paste -sd,)" -coverprofile=coverage.out $pkgs

  cross_build:
    name: Cross build (${{ matrix.goos }})

    # The matrix above runs on the three operating systems GitHub hosts runners
    # for. This is the cheap other half: whether the module compiles for the
    # BSDs at all. markdown has no OS-specific code of its own, but the
    # tablewriter chain it renders through does — go-isatty, go-colorable and
    # go-runewidth all carry per-system files — so this is where a dependency
    # dropping a BSD would show up. Today all three build. A leg takes seconds
    # and produces no binary.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, openbsd, netbsd]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build
        run: go build ./...
